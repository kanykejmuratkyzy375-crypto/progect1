<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Earth Changes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        header {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 64px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            max-width: 650px;
            line-height: 1.6;
            color: #b9c7d9;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #4f8cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #3477ed;
        }

        section {
            padding: 80px 20px;
            text-align: center;
            background: #0d1b2d;
        }

        h2 {
            font-size: 36px;
        }
    </style>
</head>

<body>

<header>
    <h1>How Earth Changes</h1>

    <p>
        Explore how our planet changes over time
        using satellite imagery.
    </p>

    <button onclick="showMessage()">
        Explore Earth
    </button>
    <input id="place" type="text"
    placeholder="Enter a place">
    <button onclick="findPlace()">Find</button>
   <div id="result"></div>
</header>

<section>
    <h2>From the past to the future</h2>

    <p>
        Compare different years and discover
        how landscapes, cities, forests and water
        have changed.
    </p>
</section>

<script>
    
  function findPlace() {
    let place = document.getElementById("place").value.trim().toLowerCase();

    if (place === "bishkek") {
        document.getElementById("result").innerHTML =
            "You selected Bishkek 🇰🇬";
    } else {
        document.getElementById("result").innerHTML =
            "Place not found";
    }
}
</script>

</body>
</html>
